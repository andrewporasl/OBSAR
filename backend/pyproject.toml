[project]
name = "obsar"
version = "0.2.1"
description = "Local semantic search over a folder of images, GIFs and videos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "imageio-ffmpeg>=0.5",
    "watchdog>=5.0",
    "transformers>=4.51",
    "huggingface_hub>=0.30",
    "tqdm",
    "accelerate>=1.0",
    "sentencepiece",
    "protobuf",
    "qwen-vl-utils",
    "torch>=2.7",
    "torchvision>=0.22",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsar"]
